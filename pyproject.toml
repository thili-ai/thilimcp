[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thilimcp"
version = "0.3.0"
description = "A small, hackable MCP server (tools, resources, a prompt template, two transports) and a hand-rolled MCP-to-Claude bridge — the reference implementation for the Learn Fast course 'Build an MCP Server'."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "thili.ai" }]
keywords = ["mcp", "model-context-protocol", "agents", "tool-use", "anthropic"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcp",
  "anthropic",
  "faker",
  "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.urls]
Homepage = "https://github.com/thili-ai/thilimcp"
Repository = "https://github.com/thili-ai/thilimcp"
"Learn Fast course" = "https://learnfast.thili.ai"

[tool.hatch.build.targets.wheel]
packages = ["thilimcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
